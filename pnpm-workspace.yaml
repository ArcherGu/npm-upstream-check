minimumReleaseAgeExcludePrune: true

catalog:
  '@actions/core': ^3.0.1
  '@actions/github': ^9.1.1
  '@lightwing/eslint-config': ^1.0.160
  '@types/node': ^26.6.6
  '@typescript/native': npm:typescript@7.0.2
  eslint: ^10.14.0
  lint-staged: ^17.6.0
  npm-check-updates: ^23.1.1
  simple-git-hooks: ^2.14.0
  tsdown: ^0.23.4
  typescript: npm:@typescript/typescript6@6.0.2
  vitest: ^5.0.5
  yaml: ^2.9.1
catalogMode: prefer

cleanupUnusedCatalogs: true

allowBuilds:
  esbuild: true
  simple-git-hooks: true

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@6.3.1
  - '@octokit/plugin-paginate-rest@9.2.2'
  - undici@5.29.0
  - '@octokit/endpoint@9.0.6'

minimumReleaseAgeExclude:
  - npm-check-updates@23.1.1

overrides:
  tinypool@<2.1.2: ^2.2.0
  katex@<0.18.2: ^0.18.2
  minimatch@>=9.0.0 <11.0.1: ^11.0.1
  glob@>=9.0.0 <14.0.2: ^14.0.2
  nanoid@<3.3.16: ^6.0.0
  nanoid@<3.3.18: ^6.0.0
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  vite@>=7.0.0 <=7.3.1: ^8.0.0
  vite@>=7.0.0 <=7.3.4: ^8.0.0
  vite@>=7.1.0 <=7.3.1: ^8.0.0
